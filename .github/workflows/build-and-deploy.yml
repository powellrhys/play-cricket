name: Build & Deploy Application
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
  push:
    branches:
      - main
      - feature/*

jobs:
  lint-yaml:
    name: Lint Yaml Pipelines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint YAML
        uses: powellrhys/powellrhys-iac/.github/actions/lint-yaml@main
        with:
          config_path: '.yamllint.yml'

