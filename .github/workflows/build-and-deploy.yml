name: Build & Deploy Application
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
  push:
    branches:
      - main
      - feature/*

jobs:
  # Lint yaml pipelines
  lint-yaml:
    name: Lint Yaml Pipelines
    uses: powellrhys/powellrhys-iac/.github/workflows/template-lint-yaml.yml@main
    with:
      config_path: '.yamllint.yml'

  # Lint python codebase
  lint-python:
    name: Lint Python Codebase
    uses: powellrhys/powellrhys-iac/.github/workflows/template-lint-python.yml@main
    with:
      config_path: '.flake8'
      code_directory: '.'

  build-application:
    name: Build Application
    needs: ['lint-yaml', 'lint-python']
    uses: powellrhys/powellrhys-iac/.github/workflows/template-lint-python.yml@feature/container_build_template
    with:
      image_name: playcricket-streamlit-frontend
      docker_file_path: frontend\Dockerfile
