name: Lint Codebase
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
  push:
    branches:
      - main
      - feature/*

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-yaml:
    uses: powellrhys/powellrhys-iac/.github/workflows/template-lint-yaml.yml@main
    with:
      config_path: '.yamllint.yml'

  lint-python:
    uses: powellrhys/powellrhys-iac/.github/workflows/template-lint-python.yml@main
    config_path: '.flake8'
    code_directory: '.'
